<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Secure Checkout</title>
<style>
  :root {
    --brand: #338cf0; /* Razorpay-like blue */
    --brand-hover: #2173d1;
    --text: #0d233a;
    --text-mut: #68798c;
    --border: #e2e8f0;
    --bg: #f5f8fa;
    --green: #22c55e;
  }
  body {
    margin: 0; padding: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .rzp-modal {
    background: #fff; width: 100%; max-width: 400px; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  .rzp-header {
    background: var(--brand); color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center;
  }
  .rzp-header-brand { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .rzp-header-brand img { height: 20px; filter: brightness(0) invert(1); } /* Make logo white if any */
  .rzp-timer {
    background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-variant-numeric: tabular-nums; font-weight: 600;
  }
  
  .rzp-amount-bar {
    padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fcfcfc;
  }
  .rzp-amount-text { font-size: 0.85rem; color: var(--text-mut); font-weight: 500; }
  .rzp-amount-val { font-size: 1.3rem; font-weight: 700; color: var(--text); }

  .rzp-body { padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  
  .rzp-qr-wrap {
    width: 160px; height: 160px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 16px;
    background: #fff; display: flex; align-items: center; justify-content: center;
  }
  .rzp-qr-wrap img { width: 100%; height: 100%; object-fit: contain; }
  
  .rzp-upi-id {
    font-size: 0.9rem; font-weight: 500; color: var(--text); background: #f1f5f9; padding: 8px 12px; border-radius: 6px; border: 1px dashed #cbd5e1;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px;
  }
  .rzp-upi-id:hover { background: #e2e8f0; }
  
  .rzp-divider {
    width: 100%; text-align: center; border-bottom: 1px solid var(--border); line-height: 0.1em; margin: 10px 0 20px;
  }
  .rzp-divider span { background:#fff; padding:0 10px; color:var(--text-mut); font-size:0.8rem; }
  
  .rzp-apps {
    display: flex; gap: 12px; justify-content: center; width: 100%; margin-bottom: 24px;
  }
  .rzp-app-btn {
    width: 50px; height: 50px; border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; background: #fff; padding: 10px; box-sizing: border-box;
  }
  .rzp-app-btn:hover { border-color: var(--brand); box-shadow: 0 4px 12px rgba(51,140,240,0.15); transform: translateY(-2px); }
  .rzp-app-btn img { width: 100%; height: 100%; object-fit: contain; }
  
  .rzp-footer {
    padding: 0 20px 20px;
  }
  .rzp-btn-paid {
    width: 100%; background: var(--brand); color: #fff; border: none; padding: 14px; border-radius: 4px; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  .rzp-btn-paid:hover { background: var(--brand-hover); }
  .rzp-btn-paid:disabled { background: #cbd5e1; cursor: not-allowed; }

  /* Loading State */
  .rzp-loading { display: none; padding: 40px 20px; text-align: center; flex-direction: column; align-items: center; }
  .rzp-spinner {
    width: 40px; height: 40px; border: 3px solid rgba(51,140,240,0.2); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Success State */
  .rzp-success { display: none; padding: 40px 20px; text-align: center; flex-direction: column; align-items: center; }
  .rzp-check {
    width: 60px; height: 60px; background: var(--green); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 20px;
  }

  .view-active { display: flex !important; }
  
  /* Toast */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 4px; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; }
  .toast.show { opacity: 1; }

</style>
</head>
<body>

<div class="rzp-modal">
  <div class="rzp-header">
    <div class="rzp-header-brand">DomainStore</div>
    <div class="rzp-timer" id="payTimer">10:00</div>
  </div>

  <!-- View: Payment Selection -->
  <div id="viewMain" class="view-active" style="flex-direction: column;">
    <div class="rzp-amount-bar">
      <div class="rzp-amount-text">Amount Payable</div>
      <div class="rzp-amount-val" id="displayAmount">₹0</div>
    </div>

    <div class="rzp-body">
      <div class="rzp-qr-wrap" id="qrArea">
        <span style="font-size:1.5rem; color:#ccc;">Loading QR...</span>
      </div>
      <div class="rzp-upi-id" onclick="copyUpiId()">
        <span id="upiIdDisplay">loading...</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </div>

      <div class="rzp-divider"><span>OR PAY USING APP</span></div>

      <div class="rzp-apps" id="appGrid">
        <div class="rzp-app-btn" onclick="openUpiApp('gpay')" title="Google Pay">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg" alt="GPay"/>
        </div>
        <div class="rzp-app-btn" onclick="openUpiApp('phonepe')" title="PhonePe">
          <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" alt="PhonePe"/>
        </div>
        <div class="rzp-app-btn" onclick="openUpiApp('paytm')" title="Paytm">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Paytm_Logo_%28standalone%29.svg" alt="Paytm"/>
        </div>
        <div class="rzp-app-btn" onclick="openUpiApp('bhim')" title="BHIM / Any UPI">
          <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="UPI"/>
        </div>
      </div>
    </div>

    <div class="rzp-footer">
      <button class="rzp-btn-paid" id="btnIHavePaid" onclick="markAsPaid()">I have paid</button>
      <div style="text-align:center; margin-top:12px; font-size:0.75rem; color:#94a3b8; display:flex; align-items:center; justify-content:center; gap:4px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Secured by UPI
      </div>
    </div>
  </div>

  <!-- View: Verifying Payment -->
  <div id="viewLoading" class="rzp-loading">
    <div class="rzp-spinner"></div>
    <h3 style="margin:0 0 8px; color:var(--text); font-size:1.1rem;">Verifying Payment</h3>
    <p style="margin:0 0 16px; color:var(--text-mut); font-size:0.85rem; max-width:280px; line-height:1.4;">Please do not refresh or close this page while we confirm your payment.</p>
    <div style="font-size:1.5rem; font-weight:700; color:#f59e0b; font-variant-numeric:tabular-nums;" id="verifyTimer">02:00</div>
  </div>

  <!-- View: Success -->
  <div id="viewSuccess" class="rzp-success">
    <div class="rzp-check">✓</div>
    <h3 style="margin:0 0 8px; color:var(--green); font-size:1.2rem;">Payment Successful</h3>
    <p style="margin:0 0 24px; color:var(--text-mut); font-size:0.9rem;">Your order has been verified.</p>
    <a href="/dashboard/" style="background:var(--green); color:#fff; text-decoration:none; padding:12px 24px; border-radius:4px; font-weight:600; font-size:0.95rem;">Go to Dashboard</a>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="/js/upi-payment.js"></script>
</body>
</html>
