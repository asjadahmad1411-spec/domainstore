<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search & Register Domain Names in India | EnrootHost</title>
<meta name="description" content="Check domain name availability instantly. Register .com, .in, .org, and more starting at just ₹99/year. Trusted by thousands of Indian businesses."/>
<meta name="keywords" content="buy domain name, domain registration India, cheap domains, domain name search, .in domain, .com domain, check domain availability"/>
<meta name="robots" content="index, follow"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Search & Register Domain Names in India"/>
<meta property="og:description" content="Register your perfect domain name today. Starting at just ₹99/yr."/>
<meta property="og:url" content="https://enroothost.com/domains"/>
<meta property="og:site_name" content="EnrootHost"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="Search Domain Names — EnrootHost"/>
<meta name="twitter:description" content="Register your perfect domain name today. Starting at just ₹99/yr."/>
<link rel="canonical" href="https://enroothost.com/domains"/>
<link rel="stylesheet" href="/css/main.css"/>
<link rel="stylesheet" href="/css/responsive.css"/></head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo" style="display:flex; align-items:center; gap:6px; text-decoration:none;"><span style="font-size:1.4rem;">🌱</span><span style="font-weight:900; background:linear-gradient(135deg, #10b981, #3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Enroot</span><span style="font-weight:700; color:inherit;">Host</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="/">Home</a></li>
    <li><a href="/domains" style="color:var(--accent)">Domains</a></li>
    <li><a href="/hosting">Hosting</a></li>
    <li><a href="/offers">🎁 Offers</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <a href="/login" id="navAuthBtn" class="btn btn-outline btn-sm" style="font-size:.82rem;">👤 Account</a><button class="cart-btn" onclick="location.href='/cart'">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>

<section style="padding-top:100px;min-height:100vh;">
  <div class="container">
    <div style="text-align:center;padding:48px 0 40px;">
      <h1>Find Your <span class="grad">Perfect Domain</span></h1>
      <p style="margin-top:12px;font-size:1.05rem;">Search from millions of available domains across 10+ TLDs</p>
    </div>

    <div class="search-box" style="max-width:700px;margin:0 auto 12px;">
      <span>🔍</span>
      <input type="text" id="searchInput"
        placeholder="Type domain name — e.g. mybiz or mybiz.com"
        oninput="onSearchInput(this)"
        onkeydown="if(event.key==='Enter')runSearch()"
        autocomplete="off" spellcheck="false"/>
      <button class="btn btn-primary" onclick="runSearch()">Check Availability</button>
    </div>
    <div id="searchHint" style="text-align:center;font-size:.8rem;margin-bottom:36px;min-height:20px;transition:all .2s;"></div>
    <style>@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>

    <div id="searchResults"></div>

    <div id="defaultView">
      <div class="section-title" style="margin-bottom:32px;">
        <h2>Popular <span class="grad">TLD Pricing</span></h2>
        <p>Choose from the most popular domain extensions</p>
      </div>
      <div id="tldPricingGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;"></div>
    </div>
  </div>
</section>

<footer style="background:var(--bg2);border-top:1px solid var(--border);padding:24px;text-align:center;font-size:0.85rem;color:var(--text-muted);">© 2025 EnrootHost — <a href="/" style="color:var(--accent)">Home</a></footer>
<div class="toast" id="toast"></div>
<script src="/js/main.js"></script>
<script src="/js/domain-search.js"></script>
</body>
</html>
